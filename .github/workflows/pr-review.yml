# PR code executes only in the read-only pull_request job.
# Privileged metadata handling uses GitHub APIs and never checks out PR code.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pr-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  auto-check:
    name: 🔍 静态检查
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install static checker
        run: python -m pip install flake8
      - name: Check changed Python files without importing them
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import py_compile
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', os.environ['BASE_SHA'] + '...HEAD'])
          files = [name for name in os.fsdecode(changed).split('\0') if name.endswith('.py') and pathlib.Path(name).is_file()]
          for name in files:
              py_compile.compile(name, doraise=True)
          if files:
              subprocess.run(['python', '-m', 'flake8', '--select=E9,F63,F7,F82', *('./' + name for name in files)], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Python syntax and critical lint: {len(files)} files checked. AI review is a separate optional check.\n')
          PY

  ai-review:
    name: 🤖 AI 代码审查（维护者启用）
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.ENABLE_AI_REVIEW == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base scripts only
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the proposed revision without checking it out
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch origin "$HEAD_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install review clients
        run: python -m pip install google-genai openai
      - name: Review diff as data using trusted base script
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          AI_REVIEW_STRICT: 'true'
        run: |
          python .github/scripts/ai_review.py
          test -s ai_review_result.txt
      - uses: actions/upload-artifact@v6
        with:
          name: ai-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ai_review_result.txt

  metadata:
    name: 🏷️ 标签与审查说明
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@v8
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const number = context.issue.number;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (pr.head.sha !== process.env.EXPECTED_HEAD_SHA) return;
            const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: number});
            const available = new Set((await github.paginate(github.rest.issues.listLabelsForRepo, {owner, repo})).map(label => label.name));
            const rules = [
              ['documentation', file => file.endsWith('.md') || file.startsWith('docs/')],
              ['data-source', file => file.startsWith('data_provider/')],
              ['testing', file => file.startsWith('tests/')],
              ['ci/cd', file => file.startsWith('.github/')],
              ['configuration', file => file.includes('config')]
            ];
            const labels = rules.filter(([label, match]) => available.has(label) && files.some(file => match(file.filename))).map(([label]) => label);
            if (labels.length) await github.rest.issues.addLabels({owner, repo, issue_number: number, labels});
            const sensitive = files.filter(file => file.filename.startsWith('.github/workflows/') || file.filename.startsWith('.github/scripts/')).length;
            const marker = '<!-- dsa-pr-review-status -->';
            const body = `${marker}\n审查提交：\`${pr.head.sha}\`\n\n- 静态检查由无写权限的 pull_request 工作流执行，结果请查看 Checks。\n- AI 审查仅在维护者显式启用且 PR 来自同仓库时运行；其他情况未执行，不代表通过。\n- 工作流/自动化脚本变更：${sensitive} 个，需要人工复核。\n- fork 首次贡献的工作流仍可能需要维护者批准。`;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: number});
            const previous = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (current.head.sha !== process.env.EXPECTED_HEAD_SHA) return;
            if (previous) await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number: number, body});
